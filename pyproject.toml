[project]
name = "mini-agent-cli"
version = "0.1.0"
description = "Learning project: a from-scratch CLI agent with tool calling. No frameworks, httpx + stdlib only."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
mini-agent = "mini_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_agent"]
